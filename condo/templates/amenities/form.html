{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}{{ 'Edit ' ~ amenity.name if amenity.id else 'New amenity' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit ' ~ amenity.name if amenity.id else 'New amenity' }}</h1>
<form method="post" class="card narrow">
  {{ csrf() }}
  <label>Name <input name="name" required value="{{ form.get('name', '') }}"></label>
  <label>Description <textarea name="description" rows="3">{{ form.get('description', '') }}</textarea></label>
  <div class="row">
    <label>Opens (hour) <input type="number" name="open_hour" min="0" max="23" value="{{ form.get('open_hour', 8) }}"></label>
    <label>Closes (hour) <input type="number" name="close_hour" min="1" max="24" value="{{ form.get('close_hour', 22) }}"></label>
    <label>Max hours <input type="number" name="max_hours" min="1" max="24" value="{{ form.get('max_hours', 4) }}"></label>
  </div>
  <label class="check"><input type="checkbox" name="active" {{ 'checked' if form.get('active') }}> Available for booking</label>
  <button class="btn primary">Save</button>
  <a href="{{ url_for('amenities.index') }}">Cancel</a>
</form>
{% endblock %}
